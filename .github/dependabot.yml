version: 2
# Every PR is titled "chore(deps): ..." so it passes the PR-title check (Conventional Commits).
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    # Wait two weeks before proposing a new release, so problems are caught upstream first.
    cooldown: { default-days: 14 }
    groups:
      astro: { patterns: ['astro', '@astrojs/*'] }
      fonts: { patterns: ['@fontsource/*'] }
      code-quality: { patterns: ['eslint', '@eslint/*', 'globals', 'prettier'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ['*'] } # one weekly PR for all action updates
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    cooldown: { default-days: 14 }
